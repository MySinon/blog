<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog — My Sinon 📝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

<style>
/* =========================================================
   RESET & VARIABLES
   ========================================================= */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --pink: #ec4899;
  --purple: #a855f7;
  --cyan: #22d3ee;
  --gold: #d4af37;
  --bg: #0e0918;
  --bg-soft: #16102a;
  --bg-card: #1a1330;
  --border: #2a1f42;
  --border-hover: #3d2b5e;
  --text: #f0e8ff;
  --text-dim: #b5a8cc;
  --text-soft: #7f7396;
  --gradient: linear-gradient(135deg, #ec4899, #a855f7);
  --gradient-text: linear-gradient(135deg, #e8d8ff 0%, #ec4899 50%, #a855f7 100%);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  padding-top: 64px;
  -webkit-font-smoothing: antialiased;
  position: relative;
}

/* Latar subtle */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 10%, rgba(236, 72, 153, 0.08), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(168, 85, 247, 0.06), transparent 45%);
  z-index: -1;
  pointer-events: none;
}

/* =========================================================
   NAVBAR
   ========================================================= */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 14px 5vw;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
  background: rgba(14, 9, 24, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.back-btn {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.back-btn:hover {
  color: var(--pink);
  border-color: var(--pink);
  background: rgba(236, 72, 153, 0.08);
}
.logo {
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: 0.5px;
}
.logo span {
  background: var(--gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* =========================================================
   HEADER
   ========================================================= */
.header {
  max-width: 820px;
  margin: 0 auto;
  padding: 56px 24px 24px;
  text-align: center;
}
.header h1 {
  font-size: clamp(2rem, 5.5vw, 2.8rem);
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 12px;
  background: var(--gradient-text);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradientShift 6s ease infinite;
}
@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.header p {
  color: var(--text-dim);
  font-size: 0.95rem;
  max-width: 480px;
  margin: 0 auto;
}

/* =========================================================
   CONTROLS
   ========================================================= */
.controls {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 24px 8px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.search-input {
  width: 100%;
  padding: 13px 18px 13px 44px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  color: var(--text);
  font-family: inherit;
  font-size: 0.92rem;
  outline: none;
  transition: all 0.2s;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237f7396' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='8'/><path d='m21 21-4.3-4.3'/></svg>");
  background-repeat: no-repeat;
  background-position: 16px center;
}
.search-input::placeholder { color: var(--text-soft); }
.search-input:focus {
  border-color: var(--pink);
  box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.12);
}

.cats {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.cats::-webkit-scrollbar { display: none; }

.cat-btn {
  padding: 7px 16px;
  border-radius: 50px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.cat-btn:hover {
  color: var(--text);
  border-color: var(--pink);
}
.cat-btn.active {
  background: var(--gradient);
  border-color: transparent;
  color: #fff;
}

/* =========================================================
   POSTS LIST (grid 2 kolom dengan thumbnail)
   ========================================================= */
.posts {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 24px 80px;
  display: grid;
  gap: 20px;
}

.post-card {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 22px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  align-items: center;
}
.post-card:hover {
  transform: translateY(-3px);
  border-color: var(--border-hover);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3),
              0 0 0 1px rgba(236, 72, 153, 0.15);
}

/* Thumbnail */
.post-thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 12px;
  overflow: hidden;
  background: linear-gradient(135deg, #241838, #2f1f4a);
  flex-shrink: 0;
}
.post-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}
.post-card:hover .post-thumb img {
  transform: scale(1.05);
}
.post-thumb .thumb-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.4rem;
  background: linear-gradient(135deg, #241838, #2f1f4a);
  opacity: 0.7;
}

/* Content */
.post-content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-right: 8px;
  min-width: 0;
}
.post-meta-top {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.72rem;
  color: var(--text-soft);
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.post-cat {
  padding: 2px 10px;
  background: rgba(168, 85, 247, 0.15);
  color: #d8b4fe;
  border-radius: 6px;
  font-weight: 600;
  font-size: 0.68rem;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}
.post-title {
  font-size: 1.12rem;
  font-weight: 700;
  line-height: 1.35;
  margin-bottom: 8px;
  color: var(--text);
  transition: color 0.2s;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.post-card:hover .post-title {
  color: var(--pink);
}
.post-excerpt {
  color: var(--text-dim);
  font-size: 0.88rem;
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Empty state */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty .icon {
  font-size: 2.5rem;
  margin-bottom: 12px;
  display: block;
  opacity: 0.6;
}

/* =========================================================
   READER FULL SCREEN
   ========================================================= */
.reader {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 1000;
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s, visibility 0.3s;
  will-change: opacity;
}
.reader.active {
  opacity: 1;
  visibility: visible;
}

/* Progress bar di atas */
.reader-progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  background: var(--gradient);
  width: 0%;
  z-index: 20;
  transition: width 0.1s linear;
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.6);
}

.reader-topbar {
  position: sticky;
  top: 0;
  padding: 14px 5vw;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(14, 9, 24, 0.9);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  z-index: 15;
}
.reader-back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
}
.reader-back:hover {
  color: var(--pink);
  border-color: var(--pink);
  background: rgba(236, 72, 153, 0.08);
}
.reader-tag-top {
  font-size: 0.75rem;
  color: var(--text-soft);
  letter-spacing: 0.5px;
}

/* Hero image */
.reader-hero {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 24px 0;
}
.reader-hero-img {
  width: 100%;
  aspect-ratio: 21 / 9;
  border-radius: 16px;
  overflow: hidden;
  background: linear-gradient(135deg, #241838, #2f1f4a);
  position: relative;
}
.reader-hero-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.reader-hero-img .thumb-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
  opacity: 0.5;
}

/* Article */
.reader-article {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 24px 120px;
}

.reader-cat {
  display: inline-block;
  padding: 4px 12px;
  background: rgba(168, 85, 247, 0.15);
  color: #d8b4fe;
  border-radius: 6px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
  text-transform: uppercase;
}
.reader-title {
  font-size: clamp(1.6rem, 4.2vw, 2.3rem);
  font-weight: 800;
  line-height: 1.22;
  letter-spacing: -0.7px;
  margin-bottom: 18px;
  color: var(--text);
}
.reader-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  font-size: 0.84rem;
  color: var(--text-soft);
  padding-bottom: 28px;
  margin-bottom: 36px;
  border-bottom: 1px solid var(--border);
}
.reader-meta .author {
  color: var(--cyan);
  font-weight: 500;
}

/* Body */
.reader-body {
  font-family: 'Lora', Georgia, serif;
  font-size: 1.12rem;
  line-height: 1.85;
  color: #ddd3e8;
}
.reader-body p { margin-bottom: 1.5rem; }

.reader-body h2 {
  font-family: 'Inter', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text);
  margin: 2.5rem 0 1rem;
  letter-spacing: -0.4px;
  padding-left: 16px;
  border-left: 3px solid var(--pink);
}
.reader-body h3 {
  font-family: 'Inter', sans-serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text);
  margin: 2rem 0 0.8rem;
  letter-spacing: -0.3px;
}
.reader-body ul, .reader-body ol {
  margin: 0 0 1.5rem 1.5rem;
}
.reader-body li { margin-bottom: 0.6rem; }
.reader-body blockquote {
  border-left: 3px solid var(--pink);
  padding: 6px 0 6px 22px;
  margin: 1.8rem 0;
  font-style: italic;
  color: var(--text-dim);
  font-size: 1.08rem;
}
.reader-body strong { color: var(--text); font-weight: 600; }
.reader-body em { color: var(--text-dim); font-style: italic; }
.reader-body code {
  font-family: 'Courier New', monospace;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 5px;
  font-size: 0.88em;
  color: var(--cyan);
}
.reader-body a {
  color: var(--cyan);
  text-decoration: none;
  border-bottom: 1px dashed rgba(34, 211, 238, 0.4);
  transition: all 0.2s;
}
.reader-body a:hover {
  color: var(--pink);
  border-color: var(--pink);
}
.reader-body img {
  max-width: 100%;
  height: auto;
  border-radius: 10px;
  margin: 1.5rem 0;
}

.reader-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 3rem;
  padding-top: 1.8rem;
  border-top: 1px solid var(--border);
}
.reader-tag {
  font-family: 'Inter', sans-serif;
  padding: 5px 13px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 50px;
  font-size: 0.75rem;
  color: var(--text-dim);
  transition: all 0.2s;
}
.reader-tag:hover {
  border-color: var(--pink);
  color: var(--pink);
}

/* Footer reader */
.reader-footer {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 24px 60px;
  text-align: center;
}
.reader-footer .divider {
  width: 60px;
  height: 2px;
  background: var(--gradient);
  border-radius: 2px;
  margin: 0 auto 20px;
  opacity: 0.5;
}
.reader-footer p {
  color: var(--text-soft);
  font-size: 0.85rem;
  font-style: italic;
}

/* =========================================================
   FOOTER
   ========================================================= */
.footer {
  text-align: center;
  padding: 30px 20px;
  color: var(--text-soft);
  font-size: 0.8rem;
  border-top: 1px solid var(--border);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 720px) {
  .post-card {
    grid-template-columns: 140px 1fr;
    gap: 16px;
    padding: 14px;
  }
  .post-title { font-size: 1rem; }
  .post-excerpt { -webkit-line-clamp: 2; font-size: 0.82rem; }
  .post-thumb { aspect-ratio: 1 / 1; }
}

@media (max-width: 500px) {
  body { padding-top: 58px; }
  .header { padding: 36px 20px 16px; }
  .controls { padding: 20px 20px 6px; }
  .posts { padding: 20px 16px 60px; gap: 14px; }
  .post-card {
    grid-template-columns: 1fr;
    gap: 12px;
    padding: 12px;
  }
  .post-thumb { aspect-ratio: 16 / 9; }
  .post-title { font-size: 1.02rem; -webkit-line-clamp: 3; }
  .post-excerpt { -webkit-line-clamp: 2; }
  .reader-hero { padding: 24px 16px 0; }
  .reader-hero-img { aspect-ratio: 16 / 9; }
  .reader-article { padding: 24px 20px 80px; }
  .reader-body { font-size: 1.05rem; }
  .reader-body h2 { font-size: 1.25rem; }
  .reader-topbar { padding: 12px 16px; }
}
</style>
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar">
  <a href="https://my-sinon.my.id" class="back-btn">← Kembali</a>
  <div class="logo">My<span>Sinon</span></div>
</nav>

<!-- ============ HEADER ============ -->
<header class="header">
  <h1>Blog</h1>
  <p>Cerita, opini, tutorial, dan hal random yang aku tulis.</p>
</header>

<!-- ============ CONTROLS ============ -->
<div class="controls">
  <input type="text" class="search-input" id="searchInput" placeholder="Cari artikel...">
  <div class="cats" id="catsBar"></div>
</div>

<!-- ============ POSTS ============ -->
<main class="posts" id="postsList"></main>

<!-- ============ READER FULL SCREEN ============ -->
<div class="reader" id="reader">
  <div class="reader-progress" id="readerProgress"></div>

  <div class="reader-topbar">
    <button class="reader-back" onclick="closeReader()">← Kembali ke Blog</button>

<footer class="footer" id="mainFooter">

</footer>

<script>
/* =========================================================
   DATA ARTIKEL BLOG
   ---------------------------------------------------------
   Field:
   - id (unik)
   - title
   - category
   - date (YYYY-MM-DD)
   - readTime (misal "5 min")
   - excerpt (1-2 baris)
   - cover (path foto sampul — OPSIONAL)
        Contoh: 'img/blog/anime-2025.jpg'
        Kalau null → tampil placeholder
   - tags (array, opsional)
   - content (HTML — boleh ada <img> di dalam)
   ========================================================= */
const POSTS = [
  {
    id: 'anime-2025-recommend',
    title: '5 Anime Wajib Tonton 2025 — Dari Solo Leveling sampai Oshi no Ko',
    category: 'Anime',
    date: '2025-03-15',
    readTime: '6 min',
    cover: null,
    excerpt: 'Dari aksi Solo Leveling sampai drama psikologis Oshi no Ko, ini daftar anime yang menurutku paling worth it ditonton tahun ini.',
    tags: ['anime', 'review', 'rekomendasi'],
    content: `
      <p>Tahun 2025 ini jadi tahun yang luar biasa buat industri anime. Banyak judul baru bermunculan, dan beberapa di antaranya benar-benar berhasil bikin aku nggak bisa berhenti nonton.</p>

      <h2>1. Solo Leveling Season 2</h2>
      <p>Kalau kamu suka <strong>action</strong> dengan visual yang gila-gilaan, ini juaranya. Animasi fight scene-nya bener-bener naik level dari season pertama.</p>

      <h2>2. Oshi no Ko Season 2</h2>
      <p>Yang ini lebih ke <em>drama psikologis</em>. Bukan sekadar anime idol biasa — Oshi no Ko ngangkat sisi gelap industri hiburan Jepang dengan cara yang cerdas.</p>

      <blockquote>Anime bukan cuma soal hiburan, tapi juga cerminan masyarakat.</blockquote>

      <h2>3. Spy x Family</h2>

      <h2>4. Classroom of the Elite</h2>
      <p>Kalau kamu suka <strong>mind game</strong> dan karakter yang licik tapi jenius, ini wajib masuk list.</p>

      <h2>5. Grand Blue</h2>
      <p>Komedi absurd yang nggak ada habisnya. Kalau kamu butuh tontonan buat <em>refreshing</em>, ini pilihannya.</p>

      <h2>Kesimpulan</h2>
      <p>Dari kelima anime di atas, masing-masing punya kekuatannya sendiri. Selamat maraton! 🌸</p>
    `
  },
  {
    id: 'cara-bikin-server-hp',
    title: 'Cara Bikin Server Fisik dari HP Android Bekas',
    category: 'Teknologi',
    date: '2025-02-28',
    readTime: '8 min',
    cover: null,
    excerpt: 'Punya HP bekas nganggur di lemari? Daripada dijual murah, mending diubah jadi server fisik untuk testing project kamu.',
    tags: ['server', 'tutorial', 'android'],
    content: `
      <p>Ide ini muncul waktu aku lihat HP Android lama aku yang udah nggak dipakai. Daripada nganggur, aku coba ubah jadi <strong>server fisik</strong> untuk testing project pribadi.</p>

      <h2>Alat & Bahan</h2>
      <ul>
        <li>HP Android bekas (minimal RAM 2GB)</li>
        <li>Aplikasi <strong>Termux</strong> (install dari F-Droid)</li>
        <li>Koneksi WiFi stabil</li>
        <li>Charger + kabel USB</li>
      </ul>

      <h2>Langkah-Langkah</h2>
      <p>Download Termux dari F-Droid. Setelah install, buka dan ketik <code>pkg update && pkg upgrade</code> untuk update semua package.</p>
      <p>Di Termux, install <strong>Nginx</strong> dan <strong>PHP</strong> dengan perintah <code>pkg install nginx</code>.</p>

      <blockquote>Poin utamanya: HP cuma sebagai hardware. Software-nya kita yang atur.</blockquote>

      <h2>Kelebihan & Kekurangan</h2>
      <p><strong>Kelebihan:</strong> konsumsi daya rendah, bisa nyala 24/7, murah banget.</p>
      <p><strong>Kekurangan:</strong> performance terbatas, butuh port forwarding kalau mau diakses dari internet.</p>

      <h2>Kesimpulan</h2>
      <p>Buat yang punya HP bekas dan pengen belajar <strong>server administration</strong>, ini cara paling murah dan seru.</p>
    `
  },
  {
    id: 'kenapa-suka-f1',
    title: 'Kenapa Aku Suka Banget F1 & MotoGP?',
    category: 'Opini',
    date: '2025-02-10',
    readTime: '5 min',
    cover: null,
    excerpt: 'Bukan cuma soal balapan. F1 dan MotoGP itu punya cerita, strategi, dan drama yang lebih seru dari sinetron.',

/* =========================================================
   HELPERS
   ========================================================= */
function formatDate(str) {
  const d = new Date(str);
  const m = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;
}

function getCategories() {
  return [...new Set(POSTS.map(p => p.category))];
}

// Bikin HTML thumbnail (img atau placeholder)
function thumbHTML(cover, size = 'small') {
  if (cover) {
    return `<img src="${cover}" alt="" loading="lazy"
      onerror="this.outerHTML='<div class=&quot;thumb-placeholder&quot;>📝</div>'">`;
  }
  return `<div class="thumb-placeholder">📝</div>`;
}

/* =========================================================
   STATE
   ========================================================= */
let state = {
  category: 'all',
  search: ''
};

/* =========================================================
   RENDER CATEGORIES
   ========================================================= */
function renderCats() {
  const bar = document.getElementById('catsBar');
  const cats = getCategories();

  let html = `<button class="cat-btn ${state.category === 'all' ? 'active' : ''}" data-cat="all">Semua</button>`;
  cats.forEach(c => {
    html += `<button class="cat-btn ${state.category === c ? 'active' : ''}" data-cat="${c}">${c}</button>`;
  });

  bar.innerHTML = html;
  bar.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.category = btn.dataset.cat;
      renderCats();
      renderPosts();
    });
  });
}

/* =========================================================
   FILTER
   ========================================================= */
function getFiltered() {
  let list = [...POSTS];

  if (state.category !== 'all') {
    list = list.filter(p => p.category === state.category);
  }

  if (state.search.trim()) {
    const q = state.search.toLowerCase().trim();
    list = list.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.excerpt.toLowerCase().includes(q) ||
      p.category.toLowerCase().includes(q) ||
      (p.tags && p.tags.some(t => t.toLowerCase().includes(q)))
    );
  }

  list.sort((a, b) => new Date(b.date) - new Date(a.date));
  return list;
}

/* =========================================================
   RENDER POSTS
   ========================================================= */
function renderPosts() {
  const list = document.getElementById('postsList');
  const filtered = getFiltered();

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <span class="icon">🌸</span>
        <p>Nggak ada artikel yang cocok.<br>Coba kata kunci lain ya!</p>
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(p => `
    <div class="post-card" data-id="${p.id}">
      <div class="post-thumb">${thumbHTML(p.cover)}</div>
      <div class="post-content">
        <div class="post-meta-top">
          <span class="post-cat">${p.category}</span>
          <span>${formatDate(p.date)}</span>
          <span>· ${p.readTime}</span>
        </div>
        <h2 class="post-title">${p.title}</h2>
        <p class="post-excerpt">${p.excerpt}</p>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.post-card').forEach(el => {
    el.addEventListener('click', () => openReader(el.dataset.id));
  });
}

/* =========================================================
   READER FULL SCREEN
   ========================================================= */
const reader = document.getElementById('reader');
const readerArticle = document.getElementById('readerArticle');
const readerHero = document.getElementById('readerHero');
const readerTopTag = document.getElementById('readerTopTag');
const readerProgress = document.getElementById('readerProgress');

let currentPostId = null;

function openReader(id) {
  const p = POSTS.find(x => x.id === id);
  if (!p) return;

  currentPostId = id;

  // Top bar tag
  readerTopTag.textContent = p.category + ' · ' + formatDate(p.date);

  // Hero cover
  readerHero.innerHTML = `<div class="reader-hero-img">${thumbHTML(p.cover, 'hero')}</div>`;

  // Article
  const tagsHTML = (p.tags || []).length
    ? `<div class="reader-tags">${p.tags.map(t => `<span class="reader-tag">#${t}</span>`).join('')}</div>`
    : '';

  readerArticle.innerHTML = `
    <span class="reader-cat">${p.category}</span>
    <h1 class="reader-title">${p.title}</h1>
    <div class="reader-meta">
      <span class="author">✍️ My Sinon</span>
      <span>📅 ${formatDate(p.date)}</span>
      <span>⏱️ ${p.readTime} baca</span>
    </div>
    <div class="reader-body">${p.content}</div>
    ${tagsHTML}
  `;

  reader.classList.add('active');
  document.body.style.overflow = 'hidden';
  reader.scrollTop = 0;
  updateProgress();

  // URL hash biar bisa di-share
  history.pushState({ reader: id }, '', '#' + id);
}

function closeReader() {
  reader.classList.remove('active');
  document.body.style.overflow = '';
  currentPostId = null;
  readerProgress.style.width = '0%';
  if (location.hash) history.replaceState(null, '', location.pathname);
}

// Progress bar saat scroll
function updateProgress() {
  if (!reader.classList.contains('active')) return;
  const total = reader.scrollHeight - reader.clientHeight;
  const current = reader.scrollTop;
  const pct = total > 0 ? (current / total) * 100 : 0;
  readerProgress.style.width = pct + '%';
}
reader.addEventListener('scroll', updateProgress, { passive: true });

// Browser back button nutup reader
window.addEventListener('popstate', () => {
  if (reader.classList.contains('active')) closeReader();
});

// ESC key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && reader.classList.contains('active')) closeReader();
});

// Buka reader langsung kalau URL ada hash
window.addEventListener('load', () => {
  const hash = location.hash.replace('#', '');
  if (hash && POSTS.find(p => p.id === hash)) {
    setTimeout(() => openReader(hash), 200);
  }
});

/* =========================================================
   SEARCH
   ========================================================= */
let searchTimer;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = e.target.value;
    renderPosts();
  }, 200);
});

/* =========================================================
   INIT
   ========================================================= */
renderCats();
renderPosts();
</script>
